<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Who Picked It?</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#666;--line:#d8d8dc;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:20px 16px 50px}h1{font-size:46px;line-height:1;margin:12px 0 8px;letter-spacing:-1.5px}
.sub{font-size:22px;color:var(--muted);margin-bottom:18px}.card{background:var(--card);border-radius:22px;padding:20px;margin:14px 0}
button,input,select{font:inherit;width:100%;border-radius:16px;padding:17px 15px;border:1px solid var(--line);background:#fff;color:#111;font-size:24px}
button{border:0;background:#111;color:white;font-weight:800}button.secondary{background:#ececf0;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label{font-size:20px;color:var(--muted);font-weight:700;margin:0 0 10px}.big{font-size:52px;font-weight:900;text-align:center;line-height:1.05}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{font-size:24px;font-weight:700;background:#f1f1f3;border-radius:999px;padding:12px 16px}
.playerchip{font-size:25px;font-weight:750;border:2px solid #ececf0;border-radius:999px;padding:12px 16px}.dead{opacity:.3;text-decoration:line-through}
.center{text-align:center}.muted{color:var(--muted)}.hidden{display:none!important}.qr{width:min(80vw,420px);display:block;margin:10px auto;border-radius:18px}
.roomcode{font-size:64px;font-weight:900;letter-spacing:8px;text-align:center}.result{font-size:64px;font-weight:950;text-align:center}.correct{color:var(--good)}.wrong{color:var(--bad)}
.pair{font-size:42px;font-weight:900;text-align:center;line-height:1.25}.lang{display:flex;gap:8px;justify-content:flex-end}.lang button{width:auto;padding:10px 14px;font-size:18px;background:#ececf0;color:#111}
.status{font-size:22px}.tiny{font-size:16px;color:var(--muted);text-align:center;margin-top:16px}
@media(max-width:520px){h1{font-size:42px}.big{font-size:46px}.roomcode{font-size:54px}.chip,.playerchip{font-size:22px}.pair{font-size:36px}}
</style>
</head>
<body><main>
<div class="lang"><button onclick="setLang('en')">EN</button><button onclick="setLang('he')">עברית</button></div>
<h1 id="title">Who Picked It?</h1>
<div class="sub" id="tagline">The board + moderator. The memory stays human.</div>

<section id="home">
  <div class="card">
    <div class="label" data-t="yourName">Your name</div>
    <input id="name" maxlength="30" autocomplete="off">
  </div>
  <div class="grid">
    <button id="create" data-t="createGame">Create Game</button>
    <button id="joinShow" class="secondary" data-t="joinGame">Join Game</button>
  </div>
  <div id="joinBox" class="card hidden">
    <div class="label" data-t="roomCode">Room code</div>
    <input id="roomInput" maxlength="4" autocapitalize="characters" style="text-transform:uppercase;text-align:center;font-weight:900;letter-spacing:6px">
    <button id="join" style="margin-top:10px" data-t="join">Join</button>
  </div>
</section>

<section id="lobby" class="hidden">
  <div id="hostShare" class="card hidden">
    <div class="label center" data-t="scanToJoin">Scan to join</div>
    <img id="qr" class="qr">
    <div id="code" class="roomcode"></div>
  </div>
  <div class="card">
    <div class="label" data-t="players">Players</div>
    <div id="lobbyPlayers" class="chips"></div>
  </div>
  <div class="card">
    <div class="label" data-t="secretCharacter">Your secret character</div>
    <input id="character" maxlength="50" autocomplete="off" placeholder="">
    <button id="submitCharacter" style="margin-top:10px" data-t="submit">Submit</button>
    <div id="submittedMsg" class="status center muted" style="margin-top:12px"></div>
  </div>
  <button id="startGame" class="hidden" data-t="startGame">Start Game</button>
</section>

<section id="game" class="hidden">
  <div class="card">
    <div class="label center" data-t="currentTurn">Current turn</div>
    <div id="turnName" class="big"></div>
  </div>
  <div id="resultCard" class="card hidden">
    <div id="resultPair" class="pair"></div>
    <div id="resultWord" class="result"></div>
  </div>
  <div class="card">
    <div class="label" data-t="playersRemaining">Players remaining</div>
    <div id="gamePlayers" class="chips"></div>
  </div>
  <div class="card">
    <div class="label" data-t="charactersRemaining">Characters remaining</div>
    <div id="gameCharacters" class="chips"></div>
  </div>
  <div id="guessCard" class="card hidden">
    <div class="label center" data-t="yourGuess">Your guess</div>
    <select id="target"></select>
    <select id="guessCharacter" style="margin-top:10px"></select>
    <button id="guessBtn" style="margin-top:10px" data-t="checkGuess">Check Guess</button>
  </div>
  <div id="waitTurn" class="card center status muted" data-t="watchAndRemember">Watch. Listen. Remember.</div>
  <div id="winner" class="card hidden"><div class="label center" data-t="winner">Winner</div><div id="winnerName" class="big"></div></div>
</section>

<div id="error" class="tiny"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let me = null, state = null, isHost = false, currentLang = localStorage.getItem("wpi_lang") || "en";
const $ = id => document.getElementById(id);

const T = {
 en:{
  title:"Who Picked It?",tagline:"The board + moderator. The memory stays human.",
  yourName:"Your name",createGame:"Create Game",joinGame:"Join Game",roomCode:"Room code",join:"Join",
  scanToJoin:"Scan to join",players:"Players",secretCharacter:"Your secret character",submit:"Submit",
  submitted:"Submitted ✓",startGame:"Start Game",currentTurn:"Current turn",playersRemaining:"Players remaining",
  charactersRemaining:"Characters remaining",yourGuess:"Your guess",checkGuess:"Check Guess",
  watchAndRemember:"Watch. Listen. Remember.",winner:"Winner"
 },
 he:{
  title:"מי בחר את זה?",tagline:"הלוח + המנחה. הזיכרון נשאר אצלכם.",
  yourName:"השם שלך",createGame:"צור משחק",joinGame:"הצטרף למשחק",roomCode:"קוד חדר",join:"הצטרף",
  scanToJoin:"סרקו כדי להצטרף",players:"שחקנים",secretCharacter:"הדמות הסודית שלך",submit:"שלח",
  submitted:"נשלח ✓",startGame:"התחל משחק",currentTurn:"תור נוכחי",playersRemaining:"שחקנים שנותרו",
  charactersRemaining:"דמויות שנותרו",yourGuess:"הניחוש שלך",checkGuess:"בדוק ניחוש",
  watchAndRemember:"להסתכל. להקשיב. לזכור.",winner:"המנצח/ת"
 }
};
function setLang(lang){
  currentLang=lang; localStorage.setItem("wpi_lang",lang);
  document.documentElement.lang=lang; document.documentElement.dir=lang==="he"?"rtl":"ltr";
  $("title").textContent=T[lang].title; $("tagline").textContent=T[lang].tagline;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[lang][el.dataset.t]||el.textContent);
}
setLang(currentLang);

function err(msg){ $("error").textContent=msg||""; }
function show(section){
  ["home","lobby","game"].forEach(id=>$(id).classList.add("hidden"));
  $(section).classList.remove("hidden");
}
function roomFromUrl(){ return new URLSearchParams(location.search).get("room"); }
const preset = roomFromUrl(); if(preset){ $("joinBox").classList.remove("hidden"); $("roomInput").value=preset.toUpperCase(); }

$("joinShow").onclick=()=> $("joinBox").classList.toggle("hidden");
$("create").onclick=()=>{
  const name=$("name").value.trim(); if(!name) return err(currentLang==="he"?"הכניסו שם":"Enter your name");
  socket.emit("create_room",{name},res=>{
    if(!res.ok) return;
    me=socket.id; isHost=true; show("lobby");
    $("hostShare").classList.remove("hidden"); $("qr").src=res.qr; $("code").textContent=res.code;
    history.replaceState({}, "", "/?room="+res.code);
  });
};
$("join").onclick=()=>{
  const name=$("name").value.trim(), code=$("roomInput").value.trim().toUpperCase();
  if(!name||!code) return err(currentLang==="he"?"נדרש שם וקוד":"Name and code required");
  socket.emit("join_room",{code,name},res=>{
    if(!res.ok) return err(res.error);
    me=socket.id; show("lobby"); history.replaceState({}, "", "/?room="+res.code);
  });
};
$("submitCharacter").onclick=()=>{
  const character=$("character").value.trim();
  socket.emit("submit_character",{character},res=>{
    if(res.ok) $("submittedMsg").textContent=T[currentLang].submitted;
  });
};
$("startGame").onclick=()=>socket.emit("start_game",{},res=>{ if(!res.ok) err(res.error); });

socket.on("room_state", s=>{
  state=s; if(!me) me=socket.id;
  const self=s.players.find(p=>p.id===me); if(!self) return;
  isHost=s.hostId===me;
  if(!s.started){
    show("lobby");
    $("lobbyPlayers").innerHTML=s.players.map(p=>`<span class="playerchip">${escapeHtml(p.name)} ${p.submitted?"✓":""}</span>`).join("");
    $("startGame").classList.toggle("hidden",!isHost);
  } else {
    show("game");
    const alive=s.players.filter(p=>p.alive), turn=s.players.find(p=>p.id===s.turnId);
    $("turnName").textContent=turn?turn.name:"";
    $("gamePlayers").innerHTML=alive.map(p=>`<span class="playerchip">${escapeHtml(p.name)}</span>`).join("");
    $("gameCharacters").innerHTML=s.remainingCharacters
      .sort((a,b)=>a.name.localeCompare(b.name))
      .map(c=>`<span class="chip">${escapeHtml(c.name)}${c.count>1?" ×"+c.count:""}</span>`).join("");
    const myTurn=s.turnId===me && self.alive && !s.winnerId;
    $("guessCard").classList.toggle("hidden",!myTurn);
    $("waitTurn").classList.toggle("hidden",myTurn || !!s.winnerId);
    if(myTurn){
      $("target").innerHTML=alive.filter(p=>p.id!==me).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
      $("guessCharacter").innerHTML=s.remainingCharacters.sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${escapeAttr(c.name)}">${escapeHtml(c.name)}${c.count>1?" ×"+c.count:""}</option>`).join("");
    }
    if(s.winnerId){
      $("winner").classList.remove("hidden");
      const w=s.players.find(p=>p.id===s.winnerId); $("winnerName").textContent=w?w.name:"";
      $("guessCard").classList.add("hidden"); $("waitTurn").classList.add("hidden");
    }
  }
});
socket.on("guess_result", r=>{
  $("resultCard").classList.remove("hidden");
  $("resultPair").textContent=`${r.guesserName} → ${r.targetName}\n${r.character}`;
  $("resultPair").style.whiteSpace="pre-line";
  $("resultWord").textContent=r.result==="correct"?(currentLang==="he"?"נכון":"CORRECT"):(currentLang==="he"?"לא נכון":"WRONG");
  $("resultWord").className="result "+(r.result==="correct"?"correct":"wrong");
  setTimeout(()=>{$("resultCard").classList.add("hidden");},1800);
});
$("guessBtn").onclick=()=>{
  socket.emit("guess",{targetId:$("target").value,character:$("guessCharacter").value},res=>{if(!res.ok)err(res.error)});
};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
</script>
</body>
</html>
